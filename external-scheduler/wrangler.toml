name = "jisungport-strategy-scheduler"
main = "src/index.js"
compatibility_date = "2026-08-29"
workers_dev = true

# Cloudflare cron expressions use UTC. These are 07:50 and 08:20 KST.
[triggers]
crons = ["50 22 * * *", "20 23 * * *"]

[vars]
GITHUB_OWNER = "PJS-creator"
GITHUB_REPOSITORY = "krstock-fear-greed"
GITHUB_REF = "main"
GITHUB_RECIPIENT = "PJS-creator"
